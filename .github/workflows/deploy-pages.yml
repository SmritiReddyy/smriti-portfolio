name: Deploy static mirror to GitHub Pages

# Builds a static copy of the public portfolio and publishes it to GitHub Pages,
# as an alternative URL to the primary Vercel deployment. The admin panel is not
# included — GitHub Pages has no server runtime to host its API routes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_GITHUB_PAGES: "true"
      # Pages serves this repo at /<repo-name>. If the repo is ever renamed to
      # SmritiReddyy.github.io it is served at the domain root instead — set
      # this to an empty string at that point.
      NEXT_PUBLIC_BASE_PATH: /smriti-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Static export cannot build route handlers or the admin panel that calls
      # them. Removing them from the checkout only affects this build.
      - name: Strip server-only routes
        run: rm -rf app/api app/admin

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
